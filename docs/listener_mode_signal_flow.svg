<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" aria-labelledby="title desc">
  <title id="title">Listener Mode internal signal flow</title>
  <desc id="desc">A top-to-bottom flow chart. A source or effect forms an ambisonic field that continues to final output. A side branch passes through virtual pickup decoding, feature analysis, and a response law before returning bounded control influence. Selected plugins also provide a separate conditioned audio return.</desc>
  <rect width="900" height="820" fill="#0d0f0f"/>
  <defs>
    <style>
      text{font-family:Menlo,Monaco,'Courier New',monospace;fill:#c6cdc8}.h{fill:#d8ddd8;font-size:13px;font-weight:700}.s{fill:#939d98;font-size:11px}.tag{fill:#b4bcb7;font-size:10px}.box{fill:#111313;stroke:#303636;stroke-width:1}.accent{fill:#172019;stroke:#3b6846;stroke-width:1}.note{fill:#111313;stroke:#303636;stroke-width:1}.wireaudio{stroke:#c6cdc8;stroke-width:2;fill:none;stroke-linecap:round}.wirecontrol{stroke:#65d07d;stroke-width:2;fill:none;stroke-linecap:round}
    </style>
  </defs>
  <text class="tag" x="270" y="24">MAIN AUDIO PATH</text>
  <rect class="box" x="270" y="38" width="360" height="70"/>
  <text class="h" x="290" y="66">SOURCE / EFFECT</text>
  <text class="s" x="290" y="87">synthesis, movement, or incoming field process</text>

  <path class="wireaudio" d="M450 108 C450 118 450 128 450 138" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M444 138 H456 L450 146 Z" fill="#c6cdc8"/>
  <rect class="box" x="270" y="148" width="360" height="70"/>
  <text class="h" x="290" y="176">ACN / SN3D FIELD</text>
  <text class="s" x="290" y="197">usually tapped before final OUT trim</text>

  <path class="wireaudio" d="M450 218 C450 382 450 545 450 708" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M444 708 H456 L450 716 Z" fill="#c6cdc8"/>
  <rect class="box" x="270" y="718" width="360" height="62"/>
  <text class="h" x="290" y="745">FINAL OUT</text>
  <text class="s" x="290" y="766">encoded field continues to the intended decoder</text>

  <text class="tag" x="550" y="250">LISTENER BRANCH</text>
  <path class="wireaudio" d="M630 183 C655 183 680 183 704 183 M704 183 C704 212 704 241 704 270" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M698 270 H710 L704 276 Z" fill="#c6cdc8"/>
  <rect class="box" x="540" y="278" width="320" height="60"/>
  <text class="h" x="560" y="303">VIRTUAL PICKUP DECODING</text>
  <text class="s" x="560" y="323">tetra · cube · icosa · dodeca · sphere · profile</text>

  <path class="wireaudio" d="M700 338 C700 347 700 357 700 366" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M694 366 H706 L700 372 Z" fill="#c6cdc8"/>
  <rect class="box" x="540" y="374" width="320" height="60"/>
  <text class="h" x="560" y="399">FEATURE ANALYSIS</text>
  <text class="s" x="560" y="419">direction · energy · change · spectrum · time</text>

  <path class="wirecontrol" d="M700 434 C700 443 700 453 700 462" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M694 462 H706 L700 468 Z" fill="#65d07d"/>
  <rect class="accent" x="540" y="470" width="320" height="60"/>
  <text class="h" x="560" y="495">RESPONSE LAW</text>
  <text class="s" x="560" y="515">follow · balance · imprint · settle</text>

  <path class="wirecontrol" d="M700 530 C700 539 700 549 700 558" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M694 558 H706 L700 564 Z" fill="#65d07d"/>
  <rect class="accent" x="540" y="566" width="320" height="78"/>
  <text class="h" x="560" y="592">BOUNDED CONTROL INFLUENCE</text>
  <text class="s" x="560" y="613">movement · synthesis · register</text>
  <text class="s" x="560" y="629">reflection · field shaping</text>
  <path class="wirecontrol" d="M860 605 C867 605 873 605 880 605 M880 605 C880 434 880 263 880 93 M880 93 C880 86 880 80 880 73 M880 73 C802 73 724 73 646 73" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M646 67 V79 L638 73 Z" fill="#65d07d"/>

  <text class="tag" x="40" y="348">OPTIONAL RECURRENT AUDIO</text>
  <path class="wireaudio" d="M540 308 C480 308 420 308 360 308 M360 308 C360 334 360 360 360 386" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M354 386 H366 L360 392 Z" fill="#c6cdc8"/>
  <rect class="box" x="40" y="394" width="320" height="78"/>
  <text class="h" x="60" y="420">CONDITIONED AUDIO RETURN</text>
  <text class="s" x="60" y="441">selected plugins only</text>
  <text class="s" x="60" y="457">delayed · filtered · normalized · saturated</text>
  <path class="wireaudio" d="M40 433 C33 433 27 433 20 433 M20 433 C20 313 20 193 20 73 M20 73 C101 73 181 73 262 73" stroke-width="2" opacity=".92" fill="none"/>
  <path d="M262 67 V79 L268 73 Z" fill="#c6cdc8"/>

  <rect class="note" x="40" y="794" width="820" height="18"/>
  <path class="wireaudio" d="M56 803 C67 803 77 803 88 803" stroke-width="2" opacity=".92" fill="none"/>
  <text class="tag" x="98" y="807">audio</text>
  <path class="wirecontrol" d="M166 803 C177 803 187 803 198 803" stroke-width="2" opacity=".92" fill="none"/>
  <text class="tag" x="208" y="807">control feedback</text>
  <text class="tag" x="370" y="807">internal paths; no host or acoustic feedback required</text>
</svg>
