<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">Ambi Effect Gain signal flow</title>
  <desc id="desc">The active-order Ambisonic input splits into an unchanged encoded dry path and an auditory-body path. The body path decodes to virtual pickups, applies the gain field and pickup relationships, routes the pickups through the selected topology, applies the directional mask, subtracts the original pickup signals, and re-encodes a correction. The correction returns vertically into the field mix before output gain.</desc>
  <rect width="1080" height="470" fill="#0d0f0f"/>
  <defs>
    <style>
      text{font-family:Menlo,Monaco,'Courier New',monospace;fill:#c6cdc8}.h{fill:#d8ddd8;font-size:14px;font-weight:700}.s{fill:#939d98;font-size:11px}.tag{fill:#b4bcb7;font-size:10px;letter-spacing:.04em}.box{fill:#111313;stroke:#303636;stroke-width:1}.effect{fill:#1d1713;stroke:#c95e3b;stroke-width:1.5}.field{fill:#11191a;stroke:#57bfc4;stroke-width:1.5}.wire{stroke:#c6cdc8;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.dry{stroke:#57bfc4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.correction{stroke:#c95e3b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.note{fill:#101212;stroke:#303636;stroke-width:1}
    </style>
  </defs>

  <text class="tag" x="40" y="34">ORDER-ADAPTIVE AUDITORY-BODY PROCESSING</text>
  <rect class="field" x="40" y="68" width="170" height="74"/>
  <text class="h" x="58" y="96">1OA–7OA INPUT</text><text class="s" x="58" y="120">ACN / SN3D field</text>
  <path class="dry" d="M210 105 H812" opacity=".92"/><path d="M812 99 V111 L820 105 Z" fill="#57bfc4"/><circle cx="230" cy="105" r="6" fill="#57bfc4"/>
  <text class="tag" x="420" y="91">UNCHANGED ENCODED FIELD</text>
  <rect class="field" x="820" y="66" width="132" height="78"/>
  <text class="h" x="838" y="94">FIELD MIX</text><text class="s" x="838" y="116">dry + MIX × Δ</text><text class="s" x="838" y="132">OUT gain</text>
  <path class="dry" d="M952 105 H1024" opacity=".92"/><path d="M1024 99 V111 L1032 105 Z" fill="#57bfc4"/><text class="tag" x="973" y="89">OUT</text><text class="tag" x="966" y="128">1OA–7OA</text>

  <path class="wire" d="M230 105 V181 H175 V218" opacity=".92"/><path d="M169 218 H181 L175 226 Z" fill="#c6cdc8"/><text class="tag" x="244" y="174">PICKUP PATH</text>
  <rect class="box" x="80" y="226" width="190" height="108"/>
  <text class="h" x="98" y="254">BODY DECODE</text><text class="s" x="98" y="278">Icosa 12 · Dodeca 20</text><text class="s" x="98" y="298">Sphere 24 pickups</text><text class="s" x="98" y="318">input-energy meters</text>
  <path class="wire" d="M270 280 H297" opacity=".92"/><path d="M297 274 V286 L305 280 Z" fill="#c6cdc8"/>
  <rect class="effect" x="305" y="226" width="220" height="108"/>
  <text class="h" x="323" y="254">DIRECTIONAL GAIN FIELD</text><text class="s" x="323" y="278">common gain · pickup trims</text><text class="s" x="323" y="298">ordered spread</text><text class="s" x="323" y="318">stable deviation</text>
  <path class="wire" d="M525 280 H552" opacity=".92"/><path d="M552 274 V286 L560 280 Z" fill="#c6cdc8"/>
  <rect class="box" x="560" y="226" width="190" height="108"/>
  <text class="h" x="578" y="254">PICKUP TOPOLOGY</text><text class="s" x="578" y="278">Local · Cross</text><text class="s" x="578" y="298">Diffuse · Roaming</text><text class="s" x="578" y="318">amount · rate</text>
  <path class="wire" d="M750 280 H777" opacity=".92"/><path d="M777 274 V286 L785 280 Z" fill="#c6cdc8"/>
  <rect class="box" x="785" y="210" width="255" height="140"/>
  <text class="h" x="803" y="238">MASK + CORRECTION</text><text class="s" x="803" y="262">inside: processed pickup field</text><text class="s" x="803" y="282">outside: DRY × original pickup</text><text class="s" x="803" y="306">Δ = target − original pickup</text><text class="s" x="803" y="328">regularized encode → HOA correction</text>
  <path class="correction" d="M912 210 V174 H886 V152" opacity=".92"/><path d="M880 152 H892 L886 144 Z" fill="#c95e3b"/><text class="tag" x="920" y="192">RE-ENCODED Δ</text>

  <rect class="note" x="40" y="404" width="1000" height="34"/>
  <line class="dry" x1="62" y1="421" x2="96" y2="421" opacity=".92"/><text class="tag" x="108" y="425">unchanged encoded field</text>
  <line class="wire" x1="310" y1="421" x2="344" y2="421" opacity=".92"/><text class="tag" x="356" y="425">decoded pickup processing</text>
  <line class="correction" x1="594" y1="421" x2="628" y2="421" opacity=".92"/><text class="tag" x="640" y="425">processed-minus-original correction</text>
</svg>
