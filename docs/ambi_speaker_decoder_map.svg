<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Ambi Speaker Decoder map</title>
  <desc id="desc">Diagram showing ambisonic input, directional decoder weighting, speaker layout, and 64-channel speaker output.</desc>
  <defs>
    <style>
      .bg{fill:#111413}.panel{fill:#171a19;stroke:#444b48;stroke-width:1}.sub{fill:#202423;stroke:#444b48;stroke-width:1}.line{stroke:#88918d;stroke-width:1.4;fill:none}.faint{stroke:#3c4541;stroke-width:1;fill:none}.text{fill:#d8ddd8;font-family:Menlo,Monaco,'Courier New',monospace;font-size:13px}.small{fill:#9aa39f;font-family:Menlo,Monaco,'Courier New',monospace;font-size:10px}.muted{fill:#87908c;font-family:Menlo,Monaco,'Courier New',monospace;font-size:11px}.point{fill:#d8ddd8;stroke:#050606;stroke-width:1}.selected{fill:#78b7a6;stroke:#050606;stroke-width:1}.bar{fill:#65736d}.barhot{fill:#a9b9b2}.sector{fill:#385048}
    </style>
  </defs>
  <rect class="bg" width="900" height="430"/>

  <rect class="panel" x="34" y="38" width="206" height="318"/>
  <text class="text" x="54" y="68">ACN/SN3D INPUT</text>
  <text class="muted" x="54" y="94">ORDER 1..7</text>
  <text class="muted" x="54" y="114">CHANNELS = (N+1)^2</text>
  <g transform="translate(58 145)">
    <rect class="sub" width="148" height="148"/>
    <text class="small" x="15" y="26">W</text><text class="small" x="49" y="26">Y</text><text class="small" x="83" y="26">Z</text><text class="small" x="117" y="26">X</text>
    <text class="small" x="15" y="68">...</text><text class="small" x="15" y="111">63</text>
    <path class="faint" d="M0 39 C49 39 99 39 148 39 M0 78 C49 78 99 78 148 78 M0 117 C49 117 99 117 148 117 M37 0 C37 49 37 99 37 148 M74 0 C74 49 74 99 74 148 M111 0 C111 49 111 99 111 148" stroke-width="1" opacity=".55" fill="none"/>
  </g>
  <text class="small" x="54" y="326">64-channel input bus</text>

  <rect class="panel" x="292" y="38" width="264" height="318"/>
  <text class="text" x="312" y="68">DIRECTIONAL DECODE</text>
  <text class="muted" x="312" y="94">BASIC / EPAD / MMD / ALLRAD</text>
  <text class="muted" x="312" y="114">WIDTH + ORDER WEIGHTING</text>
  <g transform="translate(324 144)">
    <rect class="sub" width="200" height="150"/>
    <text class="small" x="10" y="18">BANDS</text>
    <text class="small" x="68" y="18">SPEAKER AED</text>
    <text class="small" x="157" y="18">FEEDS</text>

    <rect class="barhot" x="10" y="37" width="40" height="6"/>
    <rect class="bar" x="10" y="51" width="35" height="6"/>
    <rect class="bar" x="10" y="65" width="30" height="6"/>
    <rect class="bar" x="10" y="79" width="25" height="6"/>
    <rect class="bar" x="10" y="93" width="19" height="6"/>
    <rect class="bar" x="10" y="107" width="13" height="6"/>

    <rect class="bar" x="54" y="76" width="10" height="2"/>
    <path d="M64 72 L70 77 L64 82 Z" fill="#87908c"/>

    <circle class="faint" cx="101" cy="77" r="35" stroke-width="1" opacity=".75" fill="none"/>
    <path class="faint" d="M66 77 C89 77 113 77 136 77 M101 42 C101 65 101 89 101 112" stroke-width="1" opacity=".55" fill="none"/>
    <path class="sector" d="M101 77 L119 49 A35 35 0 0 1 134 68 Z" opacity=".82"/>
    <path class="line" d="M101 77 C108 67 114 58 121 48" stroke-width="1.4" opacity=".9" fill="none"/>
    <circle class="selected" cx="121" cy="48" r="4"/>

    <rect class="bar" x="138" y="76" width="10" height="2"/>
    <path d="M148 72 L154 77 L148 82 Z" fill="#87908c"/>

    <rect class="bar" x="158" y="37" width="24" height="6"/>
    <rect class="barhot" x="158" y="51" width="32" height="6"/>
    <rect class="bar" x="158" y="65" width="17" height="6"/>
    <rect class="barhot" x="158" y="79" width="28" height="6"/>
    <rect class="bar" x="158" y="93" width="21" height="6"/>
    <rect class="bar" x="158" y="107" width="12" height="6"/>

    <text class="small" x="50" y="137">evaluate each direction</text>
  </g>
  <text class="small" x="312" y="326">order weights × speaker-direction basis</text>

  <rect class="panel" x="608" y="38" width="258" height="318"/>
  <text class="text" x="628" y="68">SPEAKER OUTPUT</text>
  <text class="muted" x="628" y="94">ACTIVE 2..64</text>
  <text class="muted" x="628" y="114">AED + DIST + GAIN</text>
  <g transform="translate(647 142)">
    <circle class="faint" cx="90" cy="82" r="74" stroke-width="1" opacity=".55" fill="none"/><circle class="faint" cx="90" cy="82" r="42" stroke-width="1" opacity=".55" fill="none"/>
    <path class="faint" d="M16 82 C65 82 115 82 164 82 M90 8 C90 57 90 107 90 156" stroke-width="1" opacity=".55" fill="none"/>
    <path class="line" d="M90 20 L138 47 L147 112 L92 151 L34 116 L42 47 Z" stroke-width="1.4" opacity=".85" fill="none"/>
    <circle class="selected" cx="90" cy="20" r="6"/><circle class="point" cx="138" cy="47" r="5"/><circle class="point" cx="147" cy="112" r="5"/><circle class="point" cx="92" cy="151" r="5"/><circle class="point" cx="34" cy="116" r="5"/><circle class="point" cx="42" cy="47" r="5"/><circle class="point" cx="90" cy="82" r="4"/>
  </g>
  <text class="small" x="628" y="326">64-channel speaker bus</text>

  <path class="line" d="M240 197 C257 197 275 197 292 197 M556 197 C573 197 591 197 608 197" stroke-width="1.4" opacity=".85" fill="none"/>
</svg>
