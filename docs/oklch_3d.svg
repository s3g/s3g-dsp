<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">Three-dimensional OKLCH color space</title>
  <desc id="desc">A cylindrical OKLCH diagram shows hue as the angle around the cylinder, lightness as its vertical axis, and chroma as distance from the neutral center. Separate annotations connect these dimensions to AED azimuth, elevation, and distance.</desc>
  <defs>
    <style>
      text { font-family: Menlo, Monaco, "Courier New", monospace; }
      .bg { fill: #080909; }
      .panel { fill: #111313; stroke: #303636; stroke-width: 1; }
      .title { fill: #d8ddd8; font-size: 18px; }
      .panel-title { fill: #d8ddd8; font-size: 14px; }
      .label { fill: #c6cdc8; font-size: 12px; }
      .small { fill: #aab3ae; font-size: 10px; }
      .muted { fill: #7f8a85; font-size: 9px; }
      .outline { fill: none; stroke: #8b9892; stroke-width: 1.5; }
      .guide { fill: none; stroke: #66726c; stroke-width: 1.2; stroke-dasharray: 4 5; }
      .axis { fill: none; stroke: #d8ddd8; stroke-width: 1.5; }
      .chroma { fill: none; stroke: #e65ea9; stroke-width: 4; }
      .hue { fill: none; stroke: #d0a25c; stroke-width: 3; }
      .projection { fill: none; stroke: #a8b0ac; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .note { fill: #171b1a; stroke: #3d4743; stroke-width: 1; }
      .note-head { fill: #9cdcfe; font-size: 11px; }
      .note-text { fill: #c6cdc8; font-size: 10px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d8ddd8"/>
    </marker>
    <linearGradient id="lightness-side" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#090a0a"/>
      <stop offset="0.48" stop-color="#68716d"/>
      <stop offset="1" stop-color="#e2e7e3"/>
    </linearGradient>
    <linearGradient id="lightness-axis" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#111313"/>
      <stop offset="1" stop-color="#eef4ef"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="980" height="650"/>
  <text class="title" x="30" y="36">2 · OKLCH COLOR SPACE</text>
  <text class="small" x="30" y="56">The derived color uses one angle, one vertical coordinate, and one radial coordinate.</text>

  <rect class="panel" x="28" y="82" width="924" height="522"/>
  <text class="panel-title" x="48" y="112">HUE · LIGHTNESS · CHROMA</text>

  <!-- Cylindrical color volume -->
  <path d="M145 195A190 55 0 0 0 525 195V495A190 55 0 0 1 145 495Z" fill="url(#lightness-side)" opacity="0.54" stroke="#8b9892" stroke-width="1.5"/>
  <ellipse cx="335" cy="495" rx="190" ry="55" fill="#090a0a" stroke="#66726c" stroke-width="1.2"/>
  <ellipse cx="335" cy="495" rx="95" ry="27.5" fill="none" stroke="#39423e" stroke-width="1"/>

  <!-- High-lightness hue/chroma disc -->
  <g opacity="0.94">
    <path d="M335 195L525 195A190 55 0 0 1 499.5 222.5Z" fill="#e64887"/>
    <path d="M335 195L499.5 222.5A190 55 0 0 1 430 242.6Z" fill="#ed4b3f"/>
    <path d="M335 195L430 242.6A190 55 0 0 1 335 250Z" fill="#bb8100"/>
    <path d="M335 195L335 250A190 55 0 0 1 240 242.6Z" fill="#789a00"/>
    <path d="M335 195L240 242.6A190 55 0 0 1 170.5 222.5Z" fill="#00ab55"/>
    <path d="M335 195L170.5 222.5A190 55 0 0 1 145 195Z" fill="#00b091"/>
    <path d="M335 195L145 195A190 55 0 0 1 170.5 167.5Z" fill="#00abc5"/>
    <path d="M335 195L170.5 167.5A190 55 0 0 1 240 147.4Z" fill="#159ce7"/>
    <path d="M335 195L240 147.4A190 55 0 0 1 335 140Z" fill="#5f7eff"/>
    <path d="M335 195L335 140A190 55 0 0 1 430 147.4Z" fill="#a65ee8"/>
    <path d="M335 195L430 147.4A190 55 0 0 1 499.5 167.5Z" fill="#cf4aba"/>
    <path d="M335 195L499.5 167.5A190 55 0 0 1 525 195Z" fill="#e64887"/>
  </g>
  <ellipse class="outline" cx="335" cy="195" rx="190" ry="55"/>
  <ellipse cx="335" cy="195" rx="95" ry="27.5" fill="none" stroke="#d2d8d5" stroke-width="1" opacity="0.62"/>
  <ellipse cx="335" cy="195" rx="43" ry="12" fill="#d6dbd8" opacity="0.94"/>

  <!-- Lightness axis -->
  <rect x="84" y="176" width="13" height="330" fill="url(#lightness-axis)" stroke="#7e8984" stroke-width="1"/>
  <path class="axis" d="M90.5 523V145" marker-end="url(#arrow)"/>
  <text class="label" x="78" y="135">L</text>
  <text class="small" x="48" y="179">LIGHT</text>
  <text class="small" x="55" y="523">DARK</text>

  <!-- Selected cross-section -->
  <ellipse class="guide" cx="335" cy="338" rx="190" ry="55"/>
  <path class="chroma" d="M335 338L482 312"/>
  <path class="projection" d="M482 312V495"/>
  <path class="hue" d="M525 338C516 322 500 315 482 312"/>
  <circle cx="335" cy="338" r="7" fill="#d6dbd8" stroke="#080909" stroke-width="2"/>
  <circle cx="482" cy="312" r="12" fill="#e65ea9" stroke="#f5e8ef" stroke-width="2"/>
  <text class="label" x="505" y="294">COLOR P′</text>
  <text class="small" x="505" y="315">h corresponds to a</text>
  <text class="small" x="505" y="332">L corresponds to e</text>
  <text class="small" x="505" y="349">C corresponds to d</text>
  <text x="412" y="340" fill="#e65ea9" font-size="13">C</text>
  <text class="small" x="230" y="374">C = 0 neutral center</text>
  <text class="small" x="230" y="392">C increases toward the rim</text>

  <!-- Separate annotations -->
  <rect class="note" x="650" y="154" width="264" height="102"/>
  <text class="note-head" x="670" y="181">HUE h</text>
  <text class="note-text" x="670" y="204">cyclic angle around the center</text>
  <text class="note-text" x="670" y="226">derived from AED azimuth a</text>

  <rect class="note" x="650" y="278" width="264" height="102"/>
  <text class="note-head" x="670" y="305">LIGHTNESS L</text>
  <text class="note-text" x="670" y="328">vertical dark-to-light position</text>
  <text class="note-text" x="670" y="350">derived from AED elevation e</text>

  <rect class="note" x="650" y="402" width="264" height="102"/>
  <text class="note-head" x="670" y="429">CHROMA C</text>
  <text class="note-text" x="670" y="452">radial distance from neutral gray</text>
  <text class="note-text" x="670" y="474">derived from AED distance d</text>

  <text class="muted" x="48" y="582">Conceptual volume. Plugins tune L/C ranges, mix selection emphasis, and clamp the final conversion to the display gamut.</text>
</svg>
