<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
  <title id="title">No Input Mixer signal and gain flow</title>
  <desc id="desc">The signed eight-by-eight matrix feeds eight destination lane processors. Each processed lane enters a contained feedback return, then a one-sample delay makes the previous return available to the matrix on the next sample and closes the loop. A separate audition branch passes through channel level, output gain, house tone, and protection to the eight audible outputs. Independent auxiliary send and return paths connect selectable lane taps to two effects loops.</desc>
  <rect width="1080" height="610" fill="#0d0f0f"/>
  <defs>
    <style>
      text{font-family:Menlo,Monaco,'Courier New',monospace;fill:#c6cdc8}.h{fill:#d8ddd8;font-size:15px;font-weight:700}.s{fill:#939d98;font-size:12px}.tag{fill:#b4bcb7;font-size:11px}.box{fill:#111313;stroke:#303636;stroke-width:1}.matrix{fill:#1d1713;stroke:#c95e3b;stroke-width:1.5}.audition{fill:#11191a;stroke:#57bfc4;stroke-width:1.5}.wire{stroke:#c6cdc8;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.feedback{stroke:#c95e3b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.output{stroke:#57bfc4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.aux{stroke:#7e8782;stroke-width:2;fill:none;stroke-dasharray:6 6}.node{fill:#d8ddd8}.note{fill:#101212;stroke:#303636;stroke-width:1}
    </style>
    <marker id="auxArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7e8782"/>
    </marker>
  </defs>

  <text class="tag" x="42" y="36">EIGHT-LANE REGENERATIVE GRAPH</text>

  <rect class="matrix" x="110" y="54" width="250" height="132"/>
  <text class="h" x="130" y="82">SIGNED 8 × 8 MATRIX</text>
  <text class="s" x="130" y="108">individual crosspoint gain</text>
  <text class="s" x="130" y="130">FDBK · COUPL · movement</text>
  <text class="s" x="130" y="152">source column →</text>
  <text class="s" x="130" y="170">destination row</text>

  <line class="wire" x1="360" y1="120" x2="492" y2="120" stroke-width="2.5" opacity=".92"/>
  <path d="M492 114 V126 L500 120 Z" fill="#c6cdc8"/>

  <rect class="box" x="500" y="64" width="250" height="112"/>
  <text class="h" x="520" y="94">DESTINATION LANE</text>
  <text class="s" x="520" y="118">body · formant · EQ</text>
  <text class="s" x="520" y="138">three inserts · choke</text>
  <text class="s" x="520" y="158">processed lane signal</text>

  <line class="wire" x1="750" y1="120" x2="772" y2="120" stroke-width="2.5" opacity=".92"/>
  <circle class="node" cx="780" cy="120" r="6"/>

  <line class="feedback" x1="780" y1="120" x2="780" y2="202" stroke-width="3" opacity=".92"/>
  <path d="M774 202 H786 L780 210 Z" fill="#c95e3b"/>
  <rect class="matrix" x="620" y="210" width="290" height="88"/>
  <text class="h" x="640" y="242">FEEDBACK RETURN</text>
  <text class="s" x="640" y="264">governor · internal tone · DC block</text>
  <text class="s" x="640" y="282">independent of channel LEVEL / MUTE</text>

  <line class="feedback" x1="620" y1="254" x2="600" y2="254" stroke-width="3" opacity=".92"/>
  <rect class="matrix" x="420" y="214" width="180" height="80"/>
  <text class="tag" x="438" y="238">ONE-SAMPLE DELAY</text>
  <text class="h" x="438" y="268">z^-1</text>
  <text class="tag" x="482" y="260">previous return</text>
  <text class="tag" x="482" y="278">feeds next sample</text>
  <line class="feedback" x1="420" y1="254" x2="70" y2="254" stroke-width="3" opacity=".92"/>
  <line class="feedback" x1="70" y1="254" x2="70" y2="120" stroke-width="3" opacity=".92"/>
  <line class="feedback" x1="70" y1="120" x2="102" y2="120" stroke-width="3" opacity=".92"/>
  <path d="M102 114 V126 L110 120 Z" fill="#c95e3b"/>

  <line class="output" x1="780" y1="120" x2="960" y2="120" stroke-width="3" opacity=".92"/>
  <line class="output" x1="960" y1="120" x2="960" y2="322" stroke-width="3" opacity=".92"/>
  <path d="M954 322 H966 L960 330 Z" fill="#57bfc4"/>
  <rect class="audition" x="820" y="330" width="220" height="82"/>
  <text class="h" x="840" y="360">CHANNEL LEVEL / MUTE</text>
  <text class="s" x="840" y="384">audition branch only</text>
  <text class="s" x="840" y="401">one control per output lane</text>

  <line class="output" x1="930" y1="412" x2="930" y2="452" stroke-width="3" opacity=".92"/>
  <path d="M924 452 H936 L930 460 Z" fill="#57bfc4"/>
  <rect class="audition" x="820" y="460" width="220" height="86"/>
  <text class="h" x="840" y="490">FINAL OUTPUT PATH</text>
  <text class="s" x="840" y="513">OUT gain · house tone</text>
  <text class="s" x="840" y="532">DC block · limiter · 8ch out</text>

  <rect class="box" x="70" y="350" width="300" height="94"/>
  <text class="h" x="90" y="380">AUX A / B RETURN LOOPS</text>
  <text class="s" x="90" y="404">selectable lane taps → effects</text>
  <text class="s" x="90" y="424">signed returns excite destinations</text>

  <line class="aux" x1="610" y1="176" x2="610" y2="386" stroke-width="2" opacity=".92"/>
  <line class="aux" x1="610" y1="386" x2="378" y2="386" stroke-width="2" opacity=".92"/>
  <path d="M378 380 V392 L370 386 Z" fill="#7e8782"/>
  <text class="tag" x="528" y="378">SEND</text>

  <line x1="220" y1="350" x2="500" y2="150" stroke="#0d0f0f" stroke-width="7" fill="none"/>
  <line class="aux" x1="220" y1="350" x2="500" y2="150" stroke-width="2" opacity=".92" marker-end="url(#auxArrow)"/>
  <text class="tag" x="280" y="320">RETURN</text>

  <rect class="note" x="42" y="564" width="910" height="28"/>
  <line class="feedback" x1="60" y1="578" x2="92" y2="578" stroke-width="3" opacity=".92"/>
  <text class="tag" x="104" y="582">internal feedback</text>
  <line class="output" x1="258" y1="578" x2="290" y2="578" stroke-width="3" opacity=".92"/>
  <text class="tag" x="302" y="582">audition / hardware output</text>
  <line class="aux" x1="516" y1="578" x2="548" y2="578" stroke-width="2" opacity=".92"/>
  <text class="tag" x="560" y="582">aux loop</text>
  <text class="tag" x="694" y="582">eight identical lane branches</text>
</svg>
